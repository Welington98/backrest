# Started by semantic-release.yml (workflow_dispatch on the new tag) or by
# pushing a vX.Y.Z tag manually. Builds and publishes all platforms.
name: Tagged Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  call-reusable-release:
    uses: ./.github/workflows/reusable-release.yml
    with:
      snapshot: false
    secrets: inherit
